name: Build and Deploy Broker UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BROKER_SSH_PRIVATE_KEY }}

      - name: Resolve image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Prepare broker deployment file
        shell: bash
        env:
          BROKERS_JSON_SECRET: ${{ secrets.BROKERS_JSON }}
        run: |
          if [ -n "$BROKERS_JSON_SECRET" ]; then
            printf '%s' "$BROKERS_JSON_SECRET" > brokers.runtime.json
          else
            cp brokers.json brokers.runtime.json
          fi
          jq empty brokers.runtime.json

      - name: Deploy enabled broker servers
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          shell_quote() {
            jq -rn --arg value "$1" '$value | @sh'
          }

          jq -c '.brokers[] | select(.enabled == true)' brokers.runtime.json | while read -r broker; do
            host="$(echo "$broker" | jq -r '.host')"
            user="$(echo "$broker" | jq -r '.user // "root"')"
            ssh_port="$(echo "$broker" | jq -r '.port // 22')"
            app_port="$(echo "$broker" | jq -r '.app_port // 8080')"
            host_port="${app_port##*:}"
            name="$(echo "$broker" | jq -r '.id // .broker_id')"
            domain="$(echo "$broker" | jq -r '.domain // empty')"
            https="$(echo "$broker" | jq -r '.https // false')"
            certbot_email="$(echo "$broker" | jq -r '.certbot_email // .ssl_email // empty')"
            env_file_b64="$(echo "$broker" | jq -r '.env // {} | to_entries[]? | "\(.key)=\(.value|tostring)"' | base64 | tr -d '\n')"
            remote_env="IMAGE=$(shell_quote "$IMAGE") GHCR_USER=$(shell_quote "$GHCR_USER") GHCR_TOKEN=$(shell_quote "$GHCR_TOKEN") APP_PORT=$(shell_quote "$app_port") HOST_PORT=$(shell_quote "$host_port") NAME=$(shell_quote "$name") DOMAIN=$(shell_quote "$domain") HTTPS=$(shell_quote "$https") CERTBOT_EMAIL=$(shell_quote "$certbot_email") ENV_FILE_B64=$(shell_quote "$env_file_b64")"

            echo "Deploying $name to $user@$host:$ssh_port"
            ssh -o StrictHostKeyChecking=no -p "$ssh_port" "$user@$host" "$remote_env sh -s" < .github/scripts/deploy-broker-ui.sh
          done
