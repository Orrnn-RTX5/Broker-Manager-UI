name: Build and Deploy Broker UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Resolve image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Trigger broker infra deploy
        shell: bash
        env:
          INFRA_REPO: ${{ github.repository_owner }}/ORRNN-RTX5-Broker-Infra
          INFRA_TOKEN: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$INFRA_TOKEN" ]]; then
            echo "INFRA_REPO_DISPATCH_TOKEN is required to trigger $INFRA_REPO" >&2
            exit 1
          fi

          payload="$(jq -n \
            --arg component "manager" \
            --arg image_ref "$IMAGE_REF" \
            --arg broker "myprop-trade" \
            --arg source_repo "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            '{event_type:"deploy-broker-component",client_payload:{component:$component,image_ref:$image_ref,broker:$broker,source_repo:$source_repo,source_sha:$source_sha}}')"

          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $INFRA_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$INFRA_REPO/dispatches" \
            -d "$payload"
