name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm.cmd run test

      - name: Prepare GitHub release target
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          RELEASE_OWNER: rtx5-orrnn
          RELEASE_REPO: rtx5-broker-manager-releases
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:GH_TOKEN) {
            throw "GH_RELEASE_TOKEN is required to publish desktop releases."
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $version = (node -p "require('./package.json').version").Trim()
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$version" }
          $apiBase = "https://api.github.com/repos/$env:RELEASE_OWNER/$env:RELEASE_REPO"

          function Invoke-GitHubApi {
            param(
              [Parameter(Mandatory = $true)][string]$Method,
              [Parameter(Mandatory = $true)][string]$Uri,
              [object]$Body = $null
            )

            $args = @{
              Method = $Method
              Uri = $Uri
              Headers = $headers
            }

            if ($null -ne $Body) {
              $args.Body = ($Body | ConvertTo-Json -Depth 10)
              $args.ContentType = "application/json"
            }

            Invoke-RestMethod @args
          }

          function Test-GitHubApiNotFound {
            param([Parameter(Mandatory = $true)]$ErrorRecord)

            $response = $ErrorRecord.Exception.Response
            return $null -ne $response -and [int]$response.StatusCode -eq 404
          }

          $mainRef = Invoke-GitHubApi -Method Get -Uri "$apiBase/git/ref/heads/main"

          try {
            Invoke-GitHubApi -Method Get -Uri "$apiBase/git/ref/tags/$tag" | Out-Null
          } catch {
            if (-not (Test-GitHubApiNotFound $_)) {
              throw
            }

            Invoke-GitHubApi -Method Post -Uri "$apiBase/git/refs" -Body @{
              ref = "refs/tags/$tag"
              sha = $mainRef.object.sha
            } | Out-Null
          }

          $release = $null
          try {
            $release = Invoke-GitHubApi -Method Get -Uri "$apiBase/releases/tags/$tag"
          } catch {
            if (-not (Test-GitHubApiNotFound $_)) {
              throw
            }

            $release = Invoke-GitHubApi -Method Post -Uri "$apiBase/releases" -Body @{
              tag_name = $tag
              target_commitish = "main"
              name = $version
              draft = $false
              prerelease = $false
            }
          }

          foreach ($asset in $release.assets) {
            Invoke-GitHubApi -Method Delete -Uri "$apiBase/releases/assets/$($asset.id)" | Out-Null
          }

      - name: Build and publish desktop app
        run: npm.cmd run release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
