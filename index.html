<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%logo V2.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTX-5 Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved manager theme before CSS/React paint to prevent a
      // light-mode flash when a user refreshes while using dark mode.
      try {
        const savedTheme = JSON.parse(localStorage.getItem('theme-storage'));
        if (savedTheme?.state?.isDarkMode === true) {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="%BASE_URL%runtime-config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
